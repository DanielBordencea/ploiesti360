<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@500;700&display=swap">
<style>
  html,body{margin:0}
  .og{width:1200px;height:630px;position:relative;overflow:hidden;background:#1C2B5D url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='520' height='520'><filter id='n' x='0' y='0' width='100%25' height='100%25'><feTurbulence type='fractalNoise' baseFrequency='0.017' numOctaves='5' seed='11' stitchTiles='stitch'/><feDiffuseLighting lighting-color='%23ffffff' surfaceScale='3.2'><feDistantLight azimuth='40' elevation='62'/></feDiffuseLighting></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.16'/></svg>");font-family:Barlow,sans-serif;color:#fff}
  .text{position:absolute;left:80px;top:64px;width:680px}
  .sup{font-family:'Bebas Neue';font-size:30px;letter-spacing:.14em;color:#fff;margin:0 0 6px}
  h1{font-family:'Bebas Neue';font-size:98px;line-height:.92;color:#FFC107;text-shadow:5px 5px 0 #0B1330;margin:0;text-transform:uppercase}
  .subl{width:480px;height:30px;margin:4px 0 18px}
  p{font-size:28px;font-weight:500;margin:0;line-height:1.3;max-width:600px}
  .cerc{position:absolute;right:90px;top:135px;width:360px;height:360px;border-radius:50%;background:#fff;overflow:hidden;box-shadow:0 0 0 10px #fff,14px 14px 0 10px #0B1330}
  .cerc img{width:100%;height:100%;object-fit:cover;transform:scale(1.06)}
  .burst{position:absolute;right:430px;top:90px;width:90px;height:90px;transform:rotate(-20deg)}
  .wedges{position:absolute;right:56px;top:470px;width:100px;height:100px;transform:rotate(140deg)}
  .url{position:absolute;left:80px;bottom:34px;font-family:'Bebas Neue';font-size:34px;letter-spacing:.1em;color:#fff}
  .url b{color:#FFC107}
</style></head>
<body><div class="og">
  <div class="text">
    <p class="sup">HUB-UL ORAȘULUI TĂU</p>
    <h1>Explorează Ploieștiul<br>la 360°</h1>
    <svg class="subl" viewBox="0 0 320 28"><path d="M6 15c50-8 110 9 170 2s90-9 138-4" fill="none" stroke="#FFC107" stroke-width="7" stroke-linecap="round"/><path d="M52 24c60-6 130 4 196-3" fill="none" stroke="#FFC107" stroke-width="4.5" stroke-linecap="round"/></svg>
    <p>Atracții, clădiri istorice, restaurante, cafenele, parcuri, evenimente și știri din Ploiești.</p>
  </div>
  <svg class="burst" viewBox="0 0 64 64"><g fill="none" stroke="#D61818" stroke-width="7" stroke-linecap="round"><path d="M32 8v17"/><path d="M9 19l14 10"/><path d="M55 19L41 29"/></g></svg>
  <span class="cerc"><img src="../src/img/logo-ploiesti-360.png" alt=""></span>
  <svg class="wedges" viewBox="0 0 72 72"><g fill="#D61818"><path d="M6 34l30 4-22 12z"/><path d="M16 8l22 20-18 6z"/><path d="M44 4l4 26-16-8z"/></g></svg>
  <p class="url">PLOIEȘTI <b>360</b></p>
</div></body></html>
